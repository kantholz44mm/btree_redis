name: redis_comparison
services:
  redis:
    image: "redis:latest"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - '6379:6379'
    volumes:
      - ./redis-override.conf:/usr/local/etc/redis/redis.conf
  btree_server:
    image: "btree-redis-server:latest"
    ports:
      - '3000:3000'
  insight:
    image: "redis/redisinsight:latest"
    ports:
      - '5540:5540'
    volumes:
      - insight-data:/data
    environment:
      - RI_REDIS_HOST1=host.docker.internal
      - RI_REDIS_ALIAS1=Redis
      - RI_REDIS_HOST2=host.docker.internal
      - RI_REDIS_PORT2=3000
      - RI_REDIS_ALIAS2=B-Tree Redis
volumes:
  insight-data:
    driver: local